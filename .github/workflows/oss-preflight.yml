name: Public-release preflight

# `check:oss` answers "is this repository safe to make public?" - history
# hygiene, tracked secrets, personal paths, package metadata, community files,
# and the server-side refs/pull/* namespace that a local-only audit cannot see.
#
# It cannot pass on a repository whose history was rewritten in place: GitHub
# keeps refs/pull/N/head for every closed and squash-merged PR, and those refs
# still reach the pre-rewrite tree. The check is designed to say so. The job
# therefore skips on private repositories; publish from a freshly created
# repository so the refs never exist.
#
# Full history is required: the check reads every ref, not just HEAD.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oss:
    if: ${{ github.event.repository.private == false }}
    name: open-source preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Black-Eclipse-site
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # No install step: the preflight uses only Node built-ins and git.
      - name: Public-release preflight
        run: node scripts/oss-preflight.js
