name: RSL rotation reminder

# Quarterly reminder for the deterministic held_out rotation (ADR-H325).
#
# This job PLANS ONLY. It never passes --apply, so CI cannot rewrite a dataset
# or a manifest. The plan is written to the step summary (and uploaded as an
# artifact); applying it stays a deliberate operator action.

on:
  schedule:
    # 09:00 UTC on 1 January / April / July / October.
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter label (default: the current UTC quarter)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rsl-rotation
  cancel-in-progress: false

defaults:
  run:
    working-directory: Black-Eclipse-site

jobs:
  plan:
    name: Plan the next rotation (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Black-Eclipse-site/python/requirements.txt

      - name: Install the Python agent stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt

      - name: Resolve the quarter label
        env:
          INPUT_QUARTER: ${{ inputs.quarter }}
        run: |
          quarter="$INPUT_QUARTER"
          if [ -z "$quarter" ]; then
            month=$((10#$(date -u +%m)))
            quarter="$(date -u +%Y)Q$(( (month - 1) / 3 + 1 ))"
          fi
          if ! [[ "$quarter" =~ ^[0-9]{4}Q[1-4]$ ]]; then
            echo "invalid quarter label: $quarter (expected e.g. 2026Q4)" >&2
            exit 1
          fi
          echo "QUARTER=$quarter" >> "$GITHUB_ENV"

      - name: Plan the rotation (dry run)
        run: |
          node scripts/rsl-rotate.js --quarter "$QUARTER" --json > rotation-plan.json
          node -e '
            const plan = require("./rotation-plan.json");
            if (!plan.ok) {
              console.error(`rotation not applicable: ${plan.reason}`);
              process.exit(1);
            }
          '

      - name: Prove the plan wrote nothing
        run: |
          changed="$(git status --porcelain -- python/harness/evaluation python/docs)"
          if [ -n "$changed" ]; then
            echo "the dry run modified the working tree:" >&2
            echo "$changed" >&2
            exit 1
          fi

      - name: Publish the plan
        run: |
          node -e '
            const fs = require("fs");
            const plan = require("./rotation-plan.json");
            const lines = [
              `### RSL rotation plan — ${plan.quarter} (dry run, no writes)`,
              "",
              `- optimization → held_out: **${plan.count}**`,
              `- held_out → optimization: **${plan.returned}**`,
              `- seed: \`${plan.seed}\``,
              "",
              "| task | from | to | version |",
              "|---|---|---|---|",
              ...plan.moves.map((m) =>
                `| ${m.taskId} | ${m.from} | ${m.to} | ${m.version} |`),
              "",
              `Apply is a deliberate operator act: \`npm run rsl:rotate -- --quarter ${plan.quarter} --apply\`.`,
              "",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          '

      - name: Upload the plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rsl-rotation-plan-${{ github.run_id }}
          path: Black-Eclipse-site/rotation-plan.json
          if-no-files-found: error
