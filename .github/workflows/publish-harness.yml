name: Publish harness

# Builds `black-eclipse-harness` and publishes it to PyPI on a version tag.
#
# This workflow is the only sanctioned way the package leaves the repository, so
# the version in pyproject.toml and the tag must agree — a mismatch fails before
# any upload. Run it by hand first with `dry_run` to prove the wheel and sdist
# build and the packaging test passes, then tag.
#
# Requires repository secret PYPI_API_TOKEN (a PyPI API token scoped to the
# `black-eclipse-harness` project). Trusted publishing is preferable once the
# project exists on PyPI; until then the token is the gate.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only, do not upload'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A public repository has no PYPI_API_TOKEN until someone adds one. Surface it
    # as a job-level env so the upload step can skip instead of failing every tag
    # with an empty twine password; `secrets` is not readable from a step `if`.
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('Black-Eclipse-site/pyproject.toml').read_text(encoding='utf-8')
          version = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M).group(1)
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          if version != tag:
              raise SystemExit(f'pyproject version {version} != tag {tag}')
          print(f'version {version} matches tag')
          PY

      - name: Build
        working-directory: Black-Eclipse-site
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: The package must carry no data
        working-directory: Black-Eclipse-site
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob('dist/*.whl')
          assert wheels, 'no wheel built'
          names = zipfile.ZipFile(wheels[0]).namelist()
          # A committed database, a golden fixture or a local .env must never ship.
          # A bare 'seed' substring is not evidence of any of those: it also matches
          # source modules (harness/a2a/agents_seed.py), which is how this gate
          # failed a legitimate build.
          data_suffixes = ('.db', '.db-wal', '.db-shm', '.sqlite', '.sqlite3',
                           '.parquet', '.csv', '.xlsx')
          code_suffixes = ('.py', '.pyi', '.typed', '.json', '.md', '.txt')
          def offending(name):
              low = name.lower()
              if low.endswith(data_suffixes):
                  return True
              if 'jdds' in low:
                  return True
              if low.endswith('.env') or '/.env' in low:
                  return True
              # A seed DATA file, i.e. 'seed' not attached to a source/document file.
              if 'seed' in low and not low.endswith(code_suffixes):
                  return True
              return False
          hits = [n for n in names if offending(n)]
          if hits:
              raise SystemExit('package carries data: ' + ', '.join(hits))
          print(f'{len(names)} entries, no data files')
          PY

      - name: Upload to PyPI
        if: ${{ (github.event_name == 'push' || inputs.dry_run == false) && env.PYPI_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: Black-Eclipse-site
        run: python -m twine upload dist/*

      - name: No PyPI token configured
        if: ${{ (github.event_name == 'push' || inputs.dry_run == false) && env.PYPI_TOKEN == '' }}
        run: echo "PYPI_API_TOKEN is not set - built and verified the wheel but did not upload."
