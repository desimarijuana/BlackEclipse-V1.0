name: CI

# GitHub Actions reads only `/.github/workflows` at the repository ROOT. The old
# workflows lived under `Black-Eclipse-site/.github/workflows/` and never ran
# (ADR-H75). This is the real gate at the correct path, mirroring
# `Black-Eclipse-site/scripts/check-all.js` step-for-step:
#   prisma generate -> typecheck -> lint -> security -> npm test -> evals ->
#   the corpus gate (the corpus vs the committed baseline).
#
# The former `backup.yml` (a daily `sqlite3 jdds.db` cron) is intentionally NOT
# restored: `jdds.db` is untracked runtime state now, so a checkout has no such
# file and the job would always fail. A local DB backup belongs in `scripts/`,
# not CI.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository. Without this, the default token
# inherits whatever the repository setting allows, which is more than a test job
# needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · lint · unit · python · evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Next build exceeds Node's default ~4 GB heap on a runner (the desktop
      # release job needs 6144 for it). Here 4096 is enough for tsc and the test
      # pool, and a lower ceiling keeps a runaway worker from being OOM-killed.
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: Black-Eclipse-site
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The committed-secret gate, before anything is installed: a tracked .env,
      # database or provider token fails the build instead of shipping.
      - name: Secret scan
        run: node scripts/scan-secrets.js

      # The SBOM and third-party notices are generated from the lockfiles. A
      # lockfile change without regenerating them is a release drift, so fail
      # the build instead of shipping a stale inventory.
      - name: SBOM drift check
        run: node scripts/generate-sbom.js --check

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Black-Eclipse-site/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Install the Python agent stack explicitly (rather than trusting the
      # postinstall hook) so a missing or misconfigured hook cannot silently skip
      # the Python half of the suite.
      #
      # `av` (PyAV 14.4.0) publishes an sdist ONLY - no wheels on any platform -
      # so pip builds it here and needs the FFmpeg development headers. Without
      # them the job dies with "pkg-config could not find libraries [avformat,
      # avcodec, ...]" before a single test runs.
      - name: System libraries for the Python stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavdevice-dev \
            libavutil-dev libavfilter-dev libswscale-dev libswresample-dev

      - name: Install Python agent stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.lock

      # --ignore-scripts avoids the postinstall side effects (vendored-Python
      # provisioning, prisma generate, global link); each is set up explicitly.
      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      # `--ignore-scripts` also skips better-sqlite3's install step, so its native
      # binding is never fetched. The auth tests are the only ones that really open
      # a database, and without the binding their vitest worker dies outright
      # ("Worker exited unexpectedly") instead of failing an assertion.
      - name: Native modules skipped by --ignore-scripts
        run: npm rebuild better-sqlite3

      # Block a production dependency with a known Critical advisory. Highs are
      # reviewed in the audit report (some are unreachable/build-only); Criticals
      # are a release gate.
      - name: Dependency audit (production criticals)
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Data sources doc check
        run: npm run docs:data-sources:check

      - name: Lint
        run: npx eslint .

      # The deploy-time security checklist, same as check-all.js. On this CI
      # runner the posture is loopback/dev, so the checks are advisory (exit 0);
      # an exposed misconfiguration fails instead of shipping.
      - name: Security preflight
        run: node scripts/security-preflight.js

      - name: Decision record + harness size budget
        run: |
          node scripts/check-adr-numbers.js
          node scripts/size-budget.js
      - name: SLO release gate
        run: node scripts/slo-gate.js
      - name: Conformance gate
        run: node scripts/conformance-gate.js
      - name: External adapter gate
        run: node scripts/external-gate.js
      - name: Tests (Vitest + Python)
        run: npm test

      - name: Drift browser smokes
        run: |
          npx playwright install --with-deps chromium
          npm run test:drift

      - name: QuantBench (deterministic quant contract)
        run: npm run test:quant-bench

      - name: Evaluation gates
        run: npm run test:evals

      # The corpus GATE: the same corpus, compared with the COMMITTED baseline.
      # A critical regression (task success, safety, hallucination rate,
      # financial accuracy, routing) fails the release here, exactly as it does
      # in the local `npm run check:all`.
      - name: Corpus gate (nightly vs committed baseline)
        run: >-
          node scripts/rsl-nightly.js
          --dataset all
          --baseline-file python/harness/evaluation/baselines/corpus_v1.json
