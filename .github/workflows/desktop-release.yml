name: Desktop release

# Builds the Windows desktop app and attaches a checksummed installer to a GitHub
# Release. Triggered by a version tag (`v0.3.2`) or manually.
#
# Why CI and not a laptop: the installer needs NSIS, a 1.2 GB payload and a
# multi-minute LZMA pass. The NSIS path-length limit (260 chars) is handled by
# scripts/desktop-installer.js, which builds through a short junction.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload to a GitHub Release (otherwise artifacts only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Black-Eclipse-site/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Black-Eclipse-site/desktop/src-tauri/target
          key: desktop-cargo-${{ runner.os }}-${{ hashFiles('Black-Eclipse-site/desktop/src-tauri/Cargo.lock') }}

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install dependencies (also vendors Python for the payload)
        working-directory: Black-Eclipse-site
        shell: bash
        # `npm ci` alone runs the postinstall hook, which also does `npm link`-style
        # global wiring and git-hook installation. Those are developer-machine
        # concerns and can fail on a clean runner, so run only what packaging needs.
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          node scripts/setup-python.js

      - name: Build the standalone payload
        working-directory: Black-Eclipse-site
        run: npm run desktop:payload

      - name: Build the Tauri shell
        working-directory: Black-Eclipse-site
        run: npm run desktop:build

      - name: Assemble the app folder
        working-directory: Black-Eclipse-site
        run: npm run desktop:package

      - name: Verify the payload carries no local configuration
        working-directory: Black-Eclipse-site
        shell: pwsh
        run: |
          $app = "dist\BlackEclipse\app"
          $leaks = @(".env", ".env.local", "mcp-servers.json", ".connector-key") |
            Where-Object { Test-Path (Join-Path $app $_) }
          if ($leaks.Count -gt 0) {
            throw "Payload contains local configuration: $($leaks -join ', ')"
          }
          Write-Host "Payload hygiene: clean"

      - name: Build the installer, checksum and winget manifests
        working-directory: Black-Eclipse-site
        run: npm run desktop:installer

      - name: Build the offline (full) installer
        working-directory: Black-Eclipse-site
        run: npm run desktop:installer -- --full

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: black-eclipse-desktop
          path: |
            Black-Eclipse-site/dist/BlackEclipse-Setup-*.exe
            Black-Eclipse-site/dist/SHA256SUMS.txt
            Black-Eclipse-site/dist/winget/**
            Black-Eclipse-site/dist/packs/*.zip
            Black-Eclipse-site/dist/packs/manifest.json
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## Install

            **winget** (recommended — skips the SmartScreen prompt):
            ```
            winget install BlackEclipse.BlackEclipse
            ```

            **Direct download:** run `BlackEclipse-Setup-*.exe`. It installs for the
            current user only — no administrator rights, no Node.js, no Python, no
            account, no sign-in.

            This build is **not code-signed**, so the first run shows "Windows
            protected your PC". Verify the SHA-256 against `SHA256SUMS.txt`, then
            choose **More info → Run anyway**.

            Your data lives in `%LOCALAPPDATA%\BlackEclipse\data` and survives
            uninstall.
          files: |
            Black-Eclipse-site/dist/BlackEclipse-Setup-*.exe
            Black-Eclipse-site/dist/SHA256SUMS.txt
            Black-Eclipse-site/dist/packs/*.zip
            Black-Eclipse-site/dist/packs/manifest.json
