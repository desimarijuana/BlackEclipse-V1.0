name: Bug report
description: Something in the desktop app, harness, or docs is wrong.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste API keys, account numbers, or real
        journal data.** For a security issue, use the private channel in
        `SECURITY.md` instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The release tag, app version, or commit you are running.
      placeholder: "v0.4.0 or 6b8c05c3"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop app (Stable)
        - Desktop app (Dev)
        - Python harness / agent run
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact credentials and personal data first.
      render: shell
    validations:
      required: false
