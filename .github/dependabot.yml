# Dependency updates for an open-source repository.
#
# WHY: most "we got breached" stories are a dependency with a known CVE, not a
# clever exploit against the app. Dependabot opens a PR with the fix and the
# existing CI (typecheck, lint, secret scan, tests) decides whether it is safe to
# merge. Grouped so the noise stays low.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/Black-Eclipse-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"

  - package-ecosystem: "pip"
    directory: "/Black-Eclipse-site/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
