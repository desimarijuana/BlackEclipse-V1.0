# ── BlackEclipse — single-service production stack ───────────────────────────
# One container runs the Next.js front door AND the Python agent harness (the
# app spawns the harness itself). Persistent state lives in the `be-data` volume.
#
#   1. cp .env.example .env      # then fill in real secrets + a provider key
#   2. docker compose up -d --build
#   3. open http://localhost:3000  (sign in with the credentials you set)
#
# Secrets you MUST set in .env: HARNESS_AUTH_SECRET, CRON_SECRET,
# CONNECTOR_SECRET_KEY, and an LLM provider key.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: black-eclipse:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      BE_DATA_DIR: /data
      # The packaged stack ALWAYS requires a signed-in user, whatever .env says.
      # HARNESS_AUTH=off is a local-dev escape hatch, not a deployment mode; with
      # this set, a missing HARNESS_AUTH_SECRET fails closed (503) instead of
      # serving an unauthenticated agent with shell/browser/file tools.
      HARNESS_AUTH: required
    # The container never opens a privileged port and never needs to gain a
    # capability, so drop them all. Paired with the non-root user in the Dockerfile.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback-only by default. This container exposes an agent that can run
      # shell commands, browse, and read/write files — publishing it on 0.0.0.0
      # puts that behind nothing but a login form. Put a TLS-terminating reverse
      # proxy in front (and set BE_BIND_ADDR=0.0.0.0) only when you mean to.
      - "${BE_BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - be-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  be-data:
