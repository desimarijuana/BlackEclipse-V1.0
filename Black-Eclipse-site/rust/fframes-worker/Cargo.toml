[package]
name = "fframes-worker"
version = "0.1.0"
edition = "2024"
description = "BlackEclipse native video render worker (fframes). Phase 1: title-card proof."
publish = false

[dependencies]
# `compile-time-svgtree` is REQUIRED for scene overlaps (`transition: "fade"`):
# without it `render_scenes` merges scenes by string concatenation, producing a
# two-root document that usvg refuses to parse. It also enables static-subtree
# hashing, which the CPU backend caches across frames.
fframes = { version = "=1.2.0", features = ["cli", "compile-time-svgtree"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
