[package]
name = "black-eclipse-desktop"
version = "0.1.0"
description = "Black Eclipse native shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native clipboard write. The page's `navigator.clipboard` goes through WebView2's
# Chromium permission bubble, which looks like a website asking for permission
# inside the app; a native `set_text` has no permission model. Text only — the
# shell never copies or reads images.
arboard = { version = "3", default-features = false }

# Unix process-group control: killing the bootstrap must also kill the Next
# server and the Python harness it spawned. `taskkill /T` does that on Windows;
# on Unix the child is started in its own session and the group is signalled.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
