<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Black Eclipse</title>
    <style>
      :root {
        --bg: #08080a;
        --panel: rgba(24, 24, 27, 0.72);
        --line: rgba(255, 255, 255, 0.08);
        --text: #fafafa;
        --muted: rgba(250, 250, 250, 0.55);
        --faint: rgba(250, 250, 250, 0.32);
        --brand: #b4ff42;
        --danger: #ff8a7a;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        user-select: none;
      }
      /* A single, calm radial wash — no gradients that flash on repaint. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(60rem 40rem at 50% 12%, rgba(180, 255, 66, 0.09), transparent 62%),
          radial-gradient(48rem 32rem at 82% 92%, rgba(52, 211, 153, 0.06), transparent 60%);
        pointer-events: none;
      }
      .stage {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
        /* Extra top room for the frameless window's custom title strip. */
        padding: 64px 32px 32px;
      }
      /* Same recipe as `.glass-card` in src/app/globals.css: translucent tint
         (<= 0.55), 18px blur with a saturation boost, inset top highlight and a
         soft drop shadow. A higher alpha here would read as a flat panel. */
      .card {
        width: min(420px, 100%);
        padding: 34px 34px 28px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(18, 18, 20, 0.55);
        backdrop-filter: blur(18px) saturate(1.35);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.06) inset,
          -1px 0 0 rgba(255, 255, 255, 0.06) inset,
          0 8px 30px rgba(0, 0, 0, 0.3);
        text-align: center;
        animation: rise 420ms cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px) scale(0.995); }
        to { opacity: 1; transform: none; }
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        position: relative;
      }
      .mark .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 210deg, var(--brand), #34d399, transparent 72%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
        animation: spin 2.4s linear infinite;
      }
      .mark .core {
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #1c1c20, #050506 70%);
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: 0 0 22px rgba(180, 255, 66, 0.14);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }
      .phase {
        min-height: 18px;
        font-size: 12.5px;
        color: var(--muted);
        margin: 0 0 20px;
        transition: color 160ms ease;
      }
      .track {
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
        position: relative;
      }
      .bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 34%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--brand), transparent);
        animation: slide 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      .foot {
        margin-top: 18px;
        font-size: 11px;
        color: var(--faint);
        letter-spacing: 0.02em;
      }
      /* Error state */
      body[data-state="error"] .bar { animation: none; width: 100%; background: var(--danger); opacity: 0.75; }
      body[data-state="error"] .phase { color: var(--danger); }
      body[data-state="error"] .mark .ring { animation-play-state: paused; filter: grayscale(1) opacity(0.5); }
      .actions { display: none; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
      body[data-state="error"] .actions { display: flex; }
      /* The log location is only useful when something failed: show it then,
         and let the user open the folder or copy the details in one click. */
      .logpath {
        display: none;
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.28);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 10px;
        line-height: 1.5;
        color: var(--faint);
        word-break: break-all;
        user-select: text;
        text-align: left;
      }
      body[data-state="error"] .logpath { display: block; }
      .copied { color: var(--brand) !important; }
      button {
        font: inherit;
        font-size: 12px;
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        cursor: pointer;
      }
      button:hover { background: rgba(255, 255, 255, 0.11); }
      button.primary { background: var(--brand); border-color: transparent; color: #0b1400; font-weight: 600; }
      button.primary:hover { filter: brightness(1.06); }
      /* Custom window chrome — the shell is frameless. No title text/logo:
         the card below already carries the brand. */
      .titlebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 32px;
        display: flex;
        align-items: stretch;
        justify-content: flex-end;
        background: transparent;
        z-index: 10;
      }
      .titlebar-drag {
        position: absolute;
        inset: 0;
        cursor: default;
      }
      .titlebar-actions { position: relative; display: flex; }
      .win-btn {
        width: 46px;
        height: 100%;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }
      .win-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
      #win-close:hover { background: #e81123; color: #fff; }
      /* Ready: fade the card out instead of popping */
      body[data-state="ready"] .card { animation: fade 260ms ease both; }
      @keyframes fade { to { opacity: 0; transform: scale(0.99); } }
    </style>
  </head>
  <body data-state="booting">
    <div class="titlebar">
      <div class="titlebar-drag" id="titlebar-drag"></div>
      <div class="titlebar-actions">
        <button class="win-btn" id="win-min" aria-label="Minimize">&#x2013;</button>
        <button class="win-btn" id="win-max" aria-label="Maximize or restore">&#x25A1;</button>
        <button class="win-btn" id="win-close" aria-label="Close">&#x2715;</button>
      </div>
    </div>
    <div class="stage">
      <div class="card">
        <div class="mark"><div class="ring"></div><div class="core"></div></div>
        <h1>Black Eclipse</h1>
        <p class="phase" id="phase">Starting…</p>
        <div class="track"><div class="bar"></div></div>
        <div class="actions">
          <button class="primary" id="retry">Try again</button>
          <button id="copy">Copy details</button>
          <button id="log">Open log folder</button>
        </div>
        <div class="logpath" id="logpath"></div>
        <div class="foot" id="foot">Local instance · 127.0.0.1:3100</div>
      </div>
    </div>
    <script>
      (function () {
        var phase = document.getElementById("phase");
        var retry = document.getElementById("retry");
        var logBtn = document.getElementById("log");
        var copyBtn = document.getElementById("copy");
        var logPath = document.getElementById("logpath");
        var foot = document.getElementById("foot");
        var tauri = window.__TAURI__;
        var lastMessage = "";
        var logInfo = { log: "", dir: "" };

        function invoke(command, args) {
          if (tauri && tauri.core && tauri.core.invoke) {
            return tauri.core.invoke(command, args || {});
          }
          return Promise.reject(new Error("no shell"));
        }

        function windowAction(action) {
          if (tauri && tauri.core && tauri.core.invoke) {
            tauri.core.invoke("desktop_window_action", { action: action }).catch(function () {});
          }
        }

        var drag = document.getElementById("titlebar-drag");
        if (drag) {
          drag.addEventListener("mousedown", function (event) {
            if (event.button === 0) windowAction("start-drag");
          });
          drag.addEventListener("dblclick", function () {
            windowAction("toggle-maximize");
          });
        }
        document.getElementById("win-min").addEventListener("click", function () {
          windowAction("minimize");
        });
        document.getElementById("win-max").addEventListener("click", function () {
          windowAction("toggle-maximize");
        });
        document.getElementById("win-close").addEventListener("click", function () {
          windowAction("close");
        });
        function setPhase(text) {
          if (text) phase.textContent = text;
        }

        function fail(message) {
          document.body.dataset.state = "error";
          setPhase(message);
          lastMessage = message || "";
          showLogPath();
        }

        // Fill in where the log lives, once, when a failure actually needs it.
        function showLogPath() {
          invoke("desktop_log_path")
            .then(function (info) {
              if (!info) return;
              logInfo = { log: info.log || "", dir: info.dir || "" };
              if (logInfo.log) {
                logPath.textContent = "Log: " + logInfo.log;
              } else if (logInfo.dir) {
                logPath.textContent = "Log folder: " + logInfo.dir;
              }
            })
            .catch(function () {});
        }

        function flash(button, text) {
          var original = button.textContent;
          button.textContent = text;
          button.classList.add("copied");
          setTimeout(function () {
            button.textContent = original;
            button.classList.remove("copied");
          }, 1400);
        }

        if (!tauri || !tauri.event) {
          // Opened outside the shell (e.g. during development): stay legible.
          setPhase("This screen is shown by the desktop shell.");
          document.body.dataset.state = "error";
          return;
        }

        tauri.event.listen("be-status", function (event) {
          var payload = event.payload || {};
          if (payload.kind === "error") {
            fail(payload.message || "Something went wrong.");
            return;
          }
          if (payload.kind === "ready") {
            document.body.dataset.state = "ready";
            return;
          }
          document.body.dataset.state = "booting";
          setPhase(payload.message);
        });

        retry.addEventListener("click", function () {
          document.body.dataset.state = "booting";
          setPhase("Starting…");
          if (tauri.core && tauri.core.invoke) {
            tauri.core.invoke("desktop_retry").catch(function () {});
          }
        });

        logBtn.addEventListener("click", function () {
          invoke("desktop_open_log").catch(function () {});
        });

        copyBtn.addEventListener("click", function () {
          var details = [
            "Black Eclipse failed to start",
            "Message: " + (lastMessage || phase.textContent || ""),
            "Log: " + (logInfo.log || "(unknown)"),
            "Instance: " + (document.getElementById("foot").textContent || ""),
          ].join("\n");
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(details).then(
              function () {
                flash(copyBtn, "Copied");
              },
              function () {
                flash(copyBtn, "Copy failed");
              }
            );
          } else {
            flash(copyBtn, "Copy unavailable");
          }
        });
      })();
    </script>
  </body>
</html>
