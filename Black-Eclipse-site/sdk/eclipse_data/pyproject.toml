[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eclipse-data"
version = "1.0.0"
description = "Eclipse's data and research from a notebook: bars, projects, edge reports, prop-firm evaluations and Pine scripts, served by the local Eclipse runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[tool.setuptools]
packages = ["eclipse_data"]
