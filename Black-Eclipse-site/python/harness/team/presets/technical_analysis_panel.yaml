id: technical_analysis_panel
name: Technical Analysis Panel
description: >-
  Trend, momentum, volatility and volume are read independently on the same
  instrument, then aggregated into a signal with explicit conflicts rather than a
  single averaged score.
objective: >-
  Read {target} technically over {timeframe} across trend, momentum, volatility
  and volume, and aggregate the signals with conflicts named.
variables: [target, timeframe]
members:
  - agent_id: ta-trend
    label: Trend Analyst
    role: researcher
    capabilities: [technical, trend]
    instructions: |
      Read the trend on {target} at {timeframe}: structure (higher highs/lows),
      moving-average alignment, and the levels that matter. Say what invalidates
      the trend, not just where it is.
  - agent_id: ta-momentum
    label: Momentum Analyst
    role: researcher
    capabilities: [technical, momentum]
    instructions: |
      Read momentum on {target}: RSI, MACD, rate of change, and whether
      momentum is confirming or diverging from price. Name the divergence you
      would trust.
  - agent_id: ta-volatility
    label: Volatility Analyst
    role: researcher
    capabilities: [technical, volatility]
    instructions: |
      Read volatility on {target}: realized vs implied, band width, expansion or
      compression, and what it implies for position size at {timeframe}.
  - agent_id: ta-aggregator
    label: Signal Aggregator
    role: chair
    capabilities: [synthesis, technical]
    instructions: |
      Aggregate the four reads into one signal. Where they disagree, do not
      average: say which read wins and why, and give the level that flips the
      conclusion.
subtasks:
  - id: trend
    objective: "Read the {timeframe} trend on {target} and its invalidation."
    assigned_agent_id: ta-trend
    capability: technical
    evidence_required: true
  - id: momentum
    objective: "Read {timeframe} momentum on {target}, including divergences."
    assigned_agent_id: ta-momentum
    capability: technical
    evidence_required: true
  - id: volatility
    objective: "Read {timeframe} volatility on {target} and its sizing implication."
    assigned_agent_id: ta-volatility
    capability: technical
    evidence_required: true
  - id: signal
    objective: "Aggregate the technical reads on {target} into one signal with conflicts named."
    assigned_agent_id: ta-aggregator
    depends_on: [trend, momentum, volatility]
    capability: synthesis
    evidence_required: true
    review: true
policy:
  max_depth: 2
  max_concurrency: 3
  require_review: true
