id: macro_rates_fx_desk
name: Macro / Rates / FX Desk
description: >-
  A rates analyst reads the curve, an FX strategist reads the dollar, a macro
  economist reads the policy path, and a portfolio manager turns the three into
  cross-asset positioning.
objective: >-
  Assess the {regime} regime for {market} over {horizon} and produce cross-asset
  positioning with the trade-offs named.
variables: [regime, market, horizon]
members:
  - agent_id: mr-rates
    label: Rates Analyst
    role: researcher
    capabilities: [rates, fixed_income]
    instructions: |
      Read the curve for {market}: level, slope, inversion, real yields and what
      the market is pricing for the policy path over {horizon}.
  - agent_id: mr-fx
    label: FX Strategist
    role: researcher
    capabilities: [fx, macro]
    instructions: |
      Read the currency: carry, positioning, terms of trade, and the dollar's
      effect on {market}. Name the level that would change your view.
  - agent_id: mr-macro
    label: Macro Economist
    role: researcher
    capabilities: [macro, policy]
    instructions: |
      Characterise the {regime} regime: growth and inflation momentum, policy
      constraints, and the most likely surprise. Separate what is known from
      what is priced.
  - agent_id: mr-pm
    label: Cross-Asset PM
    role: chair
    capabilities: [synthesis, portfolio]
    instructions: |
      Turn the three views into positioning: what to own, what to avoid, the
      hedge, and the cost of being early. Cite the subtask findings.
subtasks:
  - id: curve
    objective: "Read the {market} curve and the priced policy path over {horizon}."
    assigned_agent_id: mr-rates
    capability: rates
    evidence_required: true
  - id: currency
    objective: "Assess the currency regime affecting {market}."
    assigned_agent_id: mr-fx
    capability: fx
    evidence_required: true
  - id: macro_view
    objective: "Characterise the {regime} regime and the most likely surprise."
    assigned_agent_id: mr-macro
    capability: macro
    evidence_required: true
  - id: positioning
    objective: "Produce cross-asset positioning for {market} with hedges and trade-offs."
    assigned_agent_id: mr-pm
    depends_on: [curve, currency, macro_view]
    capability: portfolio
    evidence_required: true
    review: true
policy:
  max_depth: 2
  max_concurrency: 3
  require_review: true
